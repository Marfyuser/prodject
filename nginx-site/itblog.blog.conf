server {
    listen 80;
    server_name itblog.blog;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name itblog.blog;

    # SSL сертификаты
    ssl_certificate /etc/ssl/3x-ui/certificate1.crt;
    ssl_certificate_key /etc/ssl/3x-ui/private1.key;

    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Корневая директория сайта
    root /var/www/multilang-site;
    index index.html;

    # Логи
    access_log /var/log/nginx/itblog.blog.access.log;
    error_log /var/log/nginx/itblog.blog.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
} 